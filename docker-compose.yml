services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agro_saude_api
    # network_mode: host permite que o container acesse diretamente o Ollama (escutando em 127.0.0.1 no host com GPU)
    # e o MongoDB (exposto em 127.0.0.1:27017), além de publicar a porta 8000 diretamente no host.
    network_mode: host
    environment:
      - MONGO_URI=mongodb://127.0.0.1:27017
      - MONGO_DB=agro_saude
      - OLLAMA_HOST=http://127.0.0.1:11434
      - OLLAMA_MODEL=llama3.2
    volumes:
      - ./dados/uploads:/app/dados/uploads
      - ./banco:/app/banco
      - ./modelos:/app/modelos
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: agro_saude_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./banco/mongo_init.js:/docker-entrypoint-initdb.d/mongo_init.js:ro
    restart: unless-stopped

volumes:
  mongo_data:
